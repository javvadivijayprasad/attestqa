name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Formatting (packages/core)
        run: npm run format:check --workspace packages/core
      - name: Fixture ledger regenerates exactly
        working-directory: packages/core
        run: npm run fixture:make && git diff --exit-code -- examples/fixture-ledger/events.jsonl
      - name: Replay smoke test
        working-directory: packages/core
        shell: bash
        run: node dist/cli.js replay examples/fixture-ledger --out "${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}"
