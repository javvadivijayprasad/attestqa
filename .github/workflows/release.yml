name: release
# The one workflow (ADR-002, simplified 2026-11-03).
#   push to main / pull request  -> "check" only: the same checks on Windows and Ubuntu.
#   push of a tag vX.Y.Z         -> "check", then "publish": npm, VS Code Marketplace,
#                                   GitHub release (+ Zenodo archive via the release).
#   Run workflow (manual)        -> dry run by default: check + package, publish nothing.
# Every publish step is idempotent: if that version is already out, the step says so
# and skips, so re-running a failed run is always safe.
# Locally, `npm run preflight` at the repo root runs exactly what "check" runs.
on:
  pull_request:
  push:
    branches: [main, "release/**"]
    # A pre-release tag (v2.1.0-rc.1) marks a commit and publishes nothing.
    tags: ["v*.*.*", "!v*.*.*-*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and package only - publish nothing"
        type: boolean
        default: true

permissions:
  contents: write # the GitHub release
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - name: Fixture ledger regenerates exactly
        working-directory: packages/core
        run: npm run fixture:make && git diff --exit-code -- examples/fixture-ledger/events.jsonl
      - name: Replay smoke test
        working-directory: packages/core
        shell: bash
        run: node dist/cli.js replay examples/fixture-ledger --out "${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}"

  publish:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      - name: The tag matches both package versions
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(node -p "require('./packages/core/package.json').version")
          ext=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag $tag, engine $core, extension $ext"
          [ "$tag" = "$core" ] || { echo "::error::packages/core is $core but the tag is v$tag"; exit 1; }
          [ "$tag" = "$ext" ]  || { echo "::error::packages/vscode is $ext but the tag is v$tag"; exit 1; }

      - name: Engine - what would ship
        working-directory: packages/core
        run: npm pack --dry-run

      - name: Engine - publish to npm
        if: env.DRY_RUN != 'true'
        working-directory: packages/core
        # No token: npm trusted publishing (OIDC) - the publisher is configured on
        # npmjs.com (package attestqa -> Settings -> Trusted Publisher -> GitHub
        # Actions, this repo, this workflow file). Nothing to rotate, no OTP.
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "attestqa@$v" version >/dev/null 2>&1; then
            echo "attestqa@$v is already on npm - skipping"
          else
            npm publish --provenance --access public
          fi

      - name: Plug-in packages - what would ship
        # The @attestqa/* provider and sign-in plug-ins version INDEPENDENTLY of the
        # engine (they are not in the `fixed` set in .changeset/config.json), so they
        # are not matched to the tag. Each publish below is idempotent, so listing
        # them on every release only ships the ones whose version actually moved.
        run: |
          for dir in packages/provider-bedrock packages/auth-aws packages/auth-azure; do
            echo "== $dir =="
            ( cd "$dir" && npm pack --dry-run )
          done

      - name: Plug-in packages - publish to npm
        if: env.DRY_RUN != 'true'
        # Same trusted publishing (OIDC, no token) as the engine: EACH package name
        # needs its own Trusted Publisher on npmjs.com (owner javvadivijayprasad,
        # repo attestqa, workflow release.yml). A brand-new package's FIRST publish
        # is done once by hand from its folder (`npm publish --access public`) to
        # create the name; CI then publishes every version after that through OIDC.
        run: |
          for dir in packages/provider-bedrock packages/auth-aws packages/auth-azure; do
            name=$(node -p "require('./$dir/package.json').name")
            v=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$v" version >/dev/null 2>&1; then
              echo "$name@$v is already on npm - skipping"
            else
              ( cd "$dir" && npm publish --provenance --access public )
            fi
          done

      - name: Extension - package
        working-directory: packages/vscode
        run: npx @vscode/vsce@4.1.0 package --no-dependencies

      - name: Extension - publish to the Marketplace
        if: env.DRY_RUN != 'true'
        working-directory: packages/vscode
        # Trusted publishing (no token): the Marketplace publisher vijaypjavvadi has
        # a Trusted Publishing policy for this repository and this workflow file
        # (marketplace.visualstudio.com/manage -> Trusted Publishing). vsce >= 4.1
        # exchanges the job's GitHub OIDC token (permissions: id-token: write) for
        # a short-lived Marketplace credential. It never falls back to a PAT.
        run: |
          v=$(node -p "require('./package.json').version")
          live=$(npx @vscode/vsce@4.1.0 show vijaypjavvadi.attestqa-vscode --json 2>/dev/null | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version}catch{''}")
          if [ "$live" = "$v" ]; then
            echo "attestqa-vscode $v is already on the Marketplace - skipping"
          else
            npx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --packagePath attestqa-vscode-*.vsix
          fi

      - name: Release notes from the changelog
        if: env.DRY_RUN != 'true'
        shell: bash
        # The GitHub release body is this version's own section of the engine
        # CHANGELOG (written by `changeset version`). awk prints the lines between
        # "## X.Y.Z" and the next "## " header. No hand-maintained RELEASE_NOTES.md.
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="## $v" '
            $0 == v {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' packages/core/CHANGELOG.md > RELEASE_NOTES.generated.md
          if [ ! -s RELEASE_NOTES.generated.md ]; then
            echo "::error::no CHANGELOG section for $v in packages/core/CHANGELOG.md"
            exit 1
          fi
          echo "---- release notes for $v ----"; cat RELEASE_NOTES.generated.md

      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - skipping"
          else
            gh release create "$GITHUB_REF_NAME" packages/vscode/attestqa-vscode-*.vsix \
              --title "attestqa $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.generated.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: attestqa-vscode
          path: packages/vscode/attestqa-vscode-*.vsix
