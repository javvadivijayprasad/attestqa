# Sites attestqa tests. Website only — never their source code.
# types: which test types may run against the target (web, api, security, etl).
# Each entry must have permission_basis and checked (date) filled in during Phase 0
# before any run. Rules of engagement: Docs/06_Local_Test_Strategy.pdf §5.
defaults:
  workers: 1
  min_delay_ms: 1500
  stop_on: [429, "5xx-burst"]
  accounts: test-only

targets:
  - id: juice-shop
    tier: L
    url: http://localhost:3000
    kind: e-commerce (intentionally vulnerable)
    run: docker run -p 3000:3000 bkimminich/juice-shop
    types: [web, api, security]
    security_checks_allowed: true
    active_scan_authorised: {by: self (local instance), date: null, scope: "localhost:3000"}
    permission_basis: runs locally from the public image
    checked: null
  - id: saucedemo
    tier: H
    url: https://www.saucedemo.com
    kind: e-commerce (hosted practice site)
    tracker: azure-devops (project attestqa-saucedemo, items 105-122)
    types: [web]
    security_checks_allowed: false # UI checks only on a hosted site; no scanning
    permission_basis: "published by Sauce Labs as a practice site, demo users listed on its login page - confirm on the day"
    checked: null
    notes: "workers 1; problem / error / visual users give the built-in faults; ui-change second passes need a local saucelabs/sample-app-web build"
  - {id: demoblaze,   tier: H, url: "https://www.demoblaze.com", kind: e-commerce, permission_basis: null, checked: null}
  - {id: parabank,    tier: H, url: "https://parabank.parasoft.com/parabank/index.htm", kind: banking, permission_basis: null, checked: null}
  - {id: the-internet, tier: H, url: "https://the-internet.herokuapp.com", kind: ui-controls, permission_basis: null, checked: null, notes: "uploads are public — generated files only"}
  - {id: uitestingplayground, tier: H, url: "http://uitestingplayground.com", kind: hard-ui-cases, permission_basis: null, checked: null}
  - {id: formy,       tier: H, url: "https://formy-project.herokuapp.com", kind: forms, permission_basis: null, checked: null}
  - {id: candymapper, tier: H, url: "https://candymapper.com", kind: deliberate-errors, permission_basis: null, checked: null}
  - id: toolshop
    tier: L
    url: http://localhost:4200
    kind: e-commerce (tools shop with search, filters, admin)
    run: "testsmith-io/practice-software-testing: docker compose -f docker-compose.yml up -d; then docker exec -it pst-laravel-api-1 php artisan migrate:fresh --seed"
    tracker: jira (project TOOL)
    types: [web, api, security]
    security_checks_allowed: true
    permission_basis: runs locally from the public repository (SPRINT=sprint5; sprint5-with-bugs for seeded-fault runs only)
    checked: null
    notes: "API on :8091; default accounts as published (admin / customer); hosted copy at practicesoftwaretesting.com is NOT used"
  - id: booker
    tier: L
    url: http://localhost:3003
    kind: B&B booking + admin
    run: "mwinteringham/restful-booker-platform: docker compose up -d (check its docker-compose.yml on the day)"
    tracker: azure-devops (project attestqa-booker, items 88-104)
    types: [web, api, security]
    security_checks_allowed: true
    permission_basis: runs locally from the public repository
    checked: null
    notes: "admin account as published; hosted copy at automationintesting.online is NOT used"
  - {id: todomvc,     tier: H, url: "https://demo.playwright.dev/todomvc", kind: spa-baseline, permission_basis: null, checked: null, notes: "URL to verify"}

  # API-only targets (release 0.2) — URLs to verify in Phase 0
  - {id: restful-booker-api, tier: H, url: null, types: [api], kind: booking API, permission_basis: null, checked: null, notes: "API behind the Restful Booker platform"}
  - {id: petstore, tier: H, url: null, types: [api], kind: sample API with OpenAPI file, permission_basis: null, checked: null}

# ETL sources (release 0.5) — local only, built from the synthetic databases in E:\Sy
etl_sources:
  - {id: ecommerce, path: "E:/Sy/ecommerce.db", schema: "E:/Sy/schema_ecommerce.sql"}
  - {id: banking,   path: "E:/Sy/banking.db",   schema: "E:/Sy/schema_banking.sql"}
  - {id: healthcare, path: "E:/Sy/healthcare.db", schema: "E:/Sy/schema_healthcare.sql"}
  - {id: hr_payroll, path: "E:/Sy/hr_payroll.db", schema: "E:/Sy/schema_hr_payroll.sql"}
